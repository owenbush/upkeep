<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>upkeep</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header>
  <h1>upkeep</h1>
  <input id="filter" type="search" placeholder="Filter modules, issues, titles…" autocomplete="off">
  <div class="views" role="tablist" aria-label="View">
    <button id="view-work" type="button" role="tab" aria-selected="true">Waiting for you</button>
    <button id="view-issues" type="button" role="tab" aria-selected="false">Issue queue</button>
  </div>
  <span id="meta"></span>
</header>

<main id="modules" aria-live="polite">Loading…</main>

<aside id="drawer" hidden>
  <div class="drawer-head">
    <strong id="job-label"></strong>
    <span id="job-state"></span>
    <button id="drawer-close" type="button" aria-label="Close">×</button>
  </div>
  <pre id="job-output"></pre>
</aside>

<template id="module-template">
  <section class="module">
    <button class="module-head" type="button" aria-expanded="false">
      <span class="chev" aria-hidden="true">▸</span>
      <span class="name"></span>
      <span class="counts"></span>
      <span class="cached"></span>
    </button>
    <div class="rows" hidden></div>
  </section>
</template>

<dialog id="confirm">
  <form method="dialog">
    <p id="confirm-text"></p>
    <p class="confirm-note">This is the only thing here that leaves your machine.</p>
    <menu>
      <button value="cancel">Cancel</button>
      <button id="confirm-ok" value="ok" class="danger">Publish</button>
    </menu>
  </form>
</dialog>

<script src="/app.js" defer></script>
</body>
</html>
