name: Go release

on:
  push:
    tags: ["v*"]
  # Validates the release description without publishing anything, on any
  # change to it. A release config is only ever exercised at the moment you
  # least want to debug it, so it is exercised here instead.
  pull_request:
    paths:
      - "go/.goreleaser.yaml"
      - ".github/workflows/go-release.yml"

permissions:
  contents: write

defaults:
  run:
    working-directory: go

jobs:
  release:
    name: ${{ github.event_name == 'push' && 'Release' || 'Dry run' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser builds the changelog from the log, and a shallow clone
          # has no log to build it from.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go/go.sum

      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          workdir: go
          # On a tag: build, publish the release, push the cask. On a pull
          # request: build everything and publish none of it, so a broken
          # config fails here rather than at a tag.
          args: >-
            release --clean
            ${{ github.event_name == 'pull_request' && '--snapshot --skip=publish' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the cask to owenbush/homebrew-tap, a different repository
          # than this one — which the default GITHUB_TOKEN cannot reach. A
          # fine-grained PAT with contents:write on the tap, and nothing else.
          #
          # Absent, the tag still produces a release with working archives and
          # only the brew route is missed, so this is not worth failing a
          # release over.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Keep the dry run's artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: upkeep-snapshot
          path: |
            go/dist/*.tar.gz
            go/dist/checksums.txt
            go/dist/homebrew/Casks/*.rb
          retention-days: 7
