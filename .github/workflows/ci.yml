name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Lint (PSR-12)
        run: composer lint

      - name: Static analysis (PHPStan max)
        run: composer analyse

      - name: Run PHPUnit (with coverage)
        run: vendor/bin/phpunit --coverage-text

      - name: Smoke-test the binary
        run: ./bin/upkeep list

      # The command reference is generated from the CLI. A hand-written one is
      # a second copy of the truth, and the copy loses: the project site's
      # table sat at 11 of 27 commands long enough for the issue loop, the
      # patch surface and the browser UI to all be missing from it.
      - name: Command reference is current
        run: composer docs:check
