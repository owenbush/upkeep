name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # continue-on-error is temporary: 245 PSR-12 violations currently exist
      # and remediation is still in progress. Task 18 removes this flag once
      # the codebase is clean, making this gate blocking.
      - name: Lint (PSR-12)
        run: composer lint
        continue-on-error: true

      # continue-on-error is temporary: 302 PHPStan errors currently exist
      # and remediation is still in progress. Task 18 removes this flag once
      # the codebase is clean, making this gate blocking.
      - name: Static analysis (PHPStan max)
        run: composer analyse
        continue-on-error: true

      - name: Run PHPUnit (with coverage)
        run: vendor/bin/phpunit --coverage-text

      - name: Smoke-test the binary
        run: ./bin/upkeep list
